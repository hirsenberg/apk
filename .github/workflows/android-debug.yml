name: Android Debug APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: android-debug-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Prepare Android user directory
        run: echo "ANDROID_USER_HOME=$RUNNER_TEMP/studybell-android" >> "$GITHUB_ENV"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Install SDK and accept licenses
        shell: bash
        run: |
          mkdir -p "$ANDROID_USER_HOME/cache"
          python3 - <<'PY'
          import os, subprocess
          sdk = os.path.join(os.environ['ANDROID_HOME'], 'cmdline-tools/latest/bin/sdkmanager')
          subprocess.run([sdk, '--licenses'], input='y\n' * 100, text=True, check=True)
          subprocess.run([sdk, 'platforms;android-36', 'build-tools;35.0.0', 'platform-tools'], check=True)
          PY
      - name: Prepare licensed audio locally (never committed)
        run: |
          if ! command -v ffmpeg >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y ffmpeg
          fi
          python3 scripts/fetch_audio.py
      - name: Build installable APK
        run: ./gradlew :app:assembleDebug --no-daemon
      - name: Verify audio is packaged
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import zipfile
          apk = Path('app/build/outputs/apk/debug/app-debug.apk')
          with zipfile.ZipFile(apk) as z:
              for name in ('class_start.mp3', 'class_end.mp3'):
                  assert z.read('res/raw/' + name) == Path('app/src/main/res/raw', name).read_bytes()
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: studybell-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
